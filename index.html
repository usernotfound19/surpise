<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For my Cutush pakhi 💕</title>
  <style>
    body {
      background-color: #ffb6c1;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      color: #fff;
      margin: 0;
      padding: 20px;
    }

    /* Pin Lock Screen Overlay */
    #pin-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #ff99aa;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    #pin-screen input {
      padding: 10px 15px;
      font-size: 1.2rem;
      border-radius: 10px;
      border: none;
      text-align: center;
      outline: none;
      margin-top: 10px;
      width: 150px;
    }

    #pin-screen button {
      margin-top: 15px;
      padding: 8px 20px;
      border: none;
      background: #fff;
      color: #ff5e7e;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      font-size: 1rem;
    }

    #error-msg {
      color: #d8000c;
      margin-top: 10px;
      font-size: 0.9rem;
      display: none;
    }

    /* Main Content */
    .container {
      max-width: 650px;
      margin: 0 auto;
    }

    .letter {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(5px);
      padding: 25px;
      border-radius: 20px;
      line-height: 1.6;
      font-size: 1.05rem;
      text-align: center;
      margin-top: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      min-height: 150px;
    }

    /* Action Button after letter finishes */
    #next-btn {
      display: none;
      margin: 25px auto;
      padding: 12px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ff5e7e;
      background-color: #fff;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* Hidden Gallery Section */
    #gallery-section {
      display: none;
      margin-top: 30px;
    }

    .gallery {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .gallery img, .gallery video {
      width: 160px;
      height: 200px;
      object-fit: cover;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }

    footer {
      margin-top: 40px;
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <!-- 1. PIN Screen -->
  <div id="pin-screen">
    <h2>Enter Passcode 🔒</h2>
    <input type="password" id="pin-input" placeholder="Enter PIN">
    <button onclick="checkPin()">Unlock 💕</button>
    <div id="error-msg">Wrong Passcode! Try again 😉</div>
  </div>

  <!-- 2. Main Letter Container -->
  <div class="container">
    <h1>For You, My Love 💕</h1>

    <div class="letter">
      <p id="typed-text"></p>
    </div>

    <!-- 3. Button appears after letter finishes -->
    <button id="next-btn" onclick="showGallery()">Cutush girl 💖</button>

    <!-- 4. Photos & Video Section -->
    <div id="gallery-section">
      <h2>Pretty babe 📸</h2>
      <div class="gallery">
        <img src="./photo_6305147037644690448_y.jpg" alt="Memory 1">
        <video controls>
          <source src="./document_6305147037184697619.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
        <img src="./photo_6305147037644690449_y.jpg" alt="Memory 2">
      </div>
    </div>

    <!-- Audio Element -->
    <audio id="music" loop>
      <source src="./song.mp3" type="audio/mpeg">
    </audio>

    <footer>
      Made by Adi 🤪 🤍
    </footer>
  </div>

  <script>
    // 🔑 পিন কোডটি এখানে ইচ্ছেমতো সেট করতে পারেন (এখন 1234 দেওয়া আছে)
    const CORRECT_PIN = "200610";

    const fullText = `My love,\n\nThis small place has been made just for you. I have already grown more in love with you in such a little time than I ever imagined possible.\n\nI need you to understand that my intentions with you are true and everlasting. I am here to stand by your side, not just in your best moments, but especially during your lowest. Seeing you happy brings absolute peace to my heart.\n\nI want to spend the rest of my life with you. As soon as the right time comes, I will go to any lengths to convince both our families so we can be together forever.\n\nI love you infinitely ❤️`;

    // PIN Check & Force Start Audio
    function checkPin() {
      const inputPin = document.getElementById("pin-input").value;
      if (inputPin === CORRECT_PIN) {
        // ১. অডিও স্টার্ট
        const music = document.getElementById("music");
        music.play().then(() => {
          console.log("Music playing!");
        }).catch(e => {
          console.log("Audio play error:", e);
        });

        // ২. পিন স্ক্রিন হাইড এবং টাইপিং স্টার্ট
        document.getElementById("pin-screen").style.display = "none";
        typeWriter();
      } else {
        document.getElementById("error-msg").style.display = "block";
      }
    }

    // Typewriter Animation Function
    let index = 0;
    function typeWriter() {
      if (index < fullText.length) {
        const char = fullText.charAt(index);
        const target = document.getElementById("typed-text");
        
        if (char === '\n') {
          target.innerHTML += '<br>';
        } else {
          target.innerHTML += char;
        }
        
        index++;
        setTimeout(typeWriter, 35);
      } else {
        // টাইপিং শেষ হলে 'Cutush girl' বাটন দেখাবে
        document.getElementById("next-btn").style.display = "block";
      }
    }

    // Show Gallery Function
    function showGallery() {
      document.getElementById("gallery-section").style.display = "block";
      document.getElementById("next-btn").style.display = "none";
      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: 'smooth'
      });
    }
  </script>
</body>
</html>
